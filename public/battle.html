<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>无名战 - Arcaea Anonymous Battles</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Arcaea Anonymous Battles</a>
      <nav>
        <a href="/">主页</a>
        <a href="/battlelist.html">无名战列表</a>
        <a href="/submit.html">提交谱面</a>
        <a href="/profile.html">个人资料</a>
        <a class="admin-nav hidden" href="/admin.html">管理员后台</a>
      </nav>
      <button class="account-chip" id="accountChip" type="button">
        <img id="accountAvatar" src="/assets/avatar-placeholder.svg" alt="当前账户头像">
        <span id="accountName">未登录</span>
      </button>
    </header>

    <main class="page-stack">
      <section class="battle-hero" id="battleHero">
        <div>
          <p class="eyebrow" id="battlePhase">Battle</p>
          <h1 id="battleTitle">无名战</h1>
          <p id="battleDescription"></p>
          <div class="battle-hero-actions">
            <div class="battle-limit-note hero-limit" id="battleHeroLimit"></div>
            <button type="button" id="downloadRulesButton">下载规则文档</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-heading action-heading">
          <div>
            <p class="eyebrow">Status</p>
            <h2 id="battleStatusTitle">正在加载</h2>
          </div>
          <div class="button-row no-margin" id="battleActionBar"></div>
        </div>
        <p class="message" id="battleCountdown"></p>
        <div class="battle-phase-times" id="battlePhaseTimes"></div>
        <div id="battleSubmissionArea"></div>
      </section>

    </main>

    <script src="/app.js"></script>
  </body>
</html>
